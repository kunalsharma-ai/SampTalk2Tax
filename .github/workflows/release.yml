name: Release

# Publishes the three container images to GitHub's registry (ghcr.io) on every push to main and
# every version tag, and deploys a chosen version when asked. Deploying needs the "production"
# environment (add required reviewers to it in Settings → Environments) and its settings:
#   variables: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH (default /opt/talk2tax), PUBLIC_URL
#   secrets:   DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
# Without DEPLOY_HOST the deploy job is skipped and only images are published.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after publishing
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: Publish images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      matrix:
        include:
          - name: migrate
            file: apps/api/Dockerfile
            target: migrate
          - name: api
            file: apps/api/Dockerfile
            target: api
          - name: web
            file: apps/web/Dockerfile
            target: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: the commit (sha-xxxxxxx) always; the version for a v tag; "main" for the main branch.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/talk2tax-${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: images
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.deploy) && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      IMAGE_TAG: ${{ needs.images.outputs.tag }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/talk2tax' }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy the stack definition
        run: scp -i ~/.ssh/id_deploy deploy/docker-compose.prod.yml deploy/Caddyfile "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:$DEPLOY_PATH/"
      # Migrations run once, before the new API starts; if they fail, nothing else changes.
      - name: Pull, migrate, start
        run: |
          ssh -i ~/.ssh/id_deploy "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd '$DEPLOY_PATH' && export IMAGE_TAG='$IMAGE_TAG' REGISTRY='${REGISTRY,,}' \
             && docker compose -f docker-compose.prod.yml pull \
             && docker compose -f docker-compose.prod.yml run --rm migrate \
             && docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 180 api web caddy"
      - name: Check the deployment answers
        run: |
          for i in $(seq 1 30); do
            curl -sf "${{ vars.PUBLIC_URL }}/login" >/dev/null && curl -sf "${{ vars.PUBLIC_URL }}/api/status" && exit 0
            sleep 5
          done
          echo "The deployment did not answer at ${{ vars.PUBLIC_URL }}" && exit 1
